<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Planet-i-Green" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Point a camera at a plant and get a diagnosis, a low-cost fix, and ongoing care support."
    />
    <title>Planet-i-Green, plant health companion</title>
    <script>
      // Apply the saved (or system) theme before first paint so dark mode never flashes white.
      (function () {
        try {
          var saved = localStorage.getItem("planet.theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.style.colorScheme = dark ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#0a0e0c" : "#ffffff");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
